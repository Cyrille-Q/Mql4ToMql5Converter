# ──────────────────────────────────────────────
# T5-small pipeline configuration (HF‑compatible)
# ──────────────────────────────────────────────
# Hyperparamètres commentés pour référence.
# Tous les chemins sont relatifs à la racine du projet.

# Seed unique pour reproductibilité (torch + random)
seed: 42

# Périphérique : "auto" (cuda si disponible, sinon cpu), "cpu", "cuda"
device: auto

# Chemins des données et artefacts
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  checkpoint_dir: "checkpoints"
  input_jsonl: "mql_all_936.jsonl"
  output_pkl: "t5_dataset.pkl"
  tokenizer_dir: "data/processed/sp_mql"   # dossier du tokenizer SentencePiece

# Prétraitement
preprocessing:
  # Proportion des données pour l'entraînement (le reste = validation)
  train_split: 0.9

# Tokenizer (SentencePiece, requis pour l'export GGUF via llama.cpp)
tokenizer:
  model_type: "bpe"         # type SentencePiece ("bpe" similaire T5)
  vocab_size: 6000          # cible de vocabulaire (limité par le corpus MQL)
  character_coverage: 0.9995
  unk_piece: "<unk>"
  # T5 place PAD au rang 0. Ordre reproduit par prepare_t5_data.

# Architecture du modèle (T5-small)
model:
  d_model: 256      # hidden size (T5-small: 512)
  d_ff: 1024        # taille feed-forward (T5-small: 2048)
  num_heads: 8      # têtes d'attention (T5-small: 8)
  d_kv: 64          # dimension par tête (T5-small: 64)
  n_layer: 3        # couches encodeur = décodeur (T5-small: 6)
  dropout: 0.3      # taux de dropout
  block_size: 1024  # longueur max de séquence (encodage batch = max du batch)

# Paramètres d'entraînement
training:
  # Nombre de séquences indépendantes traitées en parallèle.
  # Une batch_size plus grande permet des gradients plus stables
  # mais nécessite plus de mémoire GPU.
  batch_size: 5
  max_epochs: 200
  eval_interval: 10      # évaluer la loss tous les N epochs
  eval_iters: 10          # nombre de batches pour estimer la loss
  learning_rate: 0.0001
  checkpoint_interval: 10 # sauvegarder un checkpoint tous les N epochs