[project]
name = "mql4-to-mql5-converter"
version = "0.1.0"
description = "Language model for converting MQL4 to MQL5 and vice versa"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "transformers>=4.30",
    "datasets>=2.12",
    "tokenizers>=0.14",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.7",
    "mypy>=1.0",
    "jupyter",
    "ipykernel",
    "wandb",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
strict = true